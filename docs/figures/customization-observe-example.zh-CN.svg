<g fill="#167D8D" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="1299" y="264" text-anchor="middle">安装定制化回调</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
<text x="1299" y="294" text-anchor="middle">ops.post_send ← observe_post_send</text>
</g>
