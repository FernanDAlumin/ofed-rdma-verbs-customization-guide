<title id="title">定制 RDMA Verbs：发送调用观测</title>
<desc id="desc">先保存原生回调并安装 context 级 overlay；运行时由定制回调更新调用与 WR 计数，再以未修改的请求调用原生 provider。原生返回值沿调用链传回应用。</desc>
<rect width="1600" height="1080" fill="white"/>
<g fill="#24324B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="42" font-weight="400">
<text x="64" y="84" text-anchor="start">定制 RDMA Verbs：发送调用观测</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="66" y="123" text-anchor="start">使用示例  /  在一个 context 中增加调用统计，再委托原生 provider 执行</text>
</g>
<rect x="64" y="158" width="1472" height="174" rx="12" fill="#F7F9FC" stroke="#BCCADC" stroke-width="1"/>
<g fill="#24324B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="23" font-weight="400">
<text x="88" y="202" text-anchor="start">01   初始化 · 创建 context 时执行一次</text>
</g>
<rect x="92" y="229" width="414" height="78" rx="12" fill="#FFFFFF" stroke="#3B6BB0" stroke-width="2"/>
<g fill="#3B6BB0" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="299" y="264" text-anchor="middle">完成原生初始化</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
<text x="299" y="294" text-anchor="middle">基础 ops + 硬件变体</text>
</g>
<rect x="591" y="229" width="414" height="78" rx="12" fill="#FFFFFF" stroke="#3B6BB0" stroke-width="2"/>
<g fill="#3B6BB0" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="798" y="264" text-anchor="middle">保存有效原生回调</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
<text x="798" y="294" text-anchor="middle">native_post_send ← effective callback</text>
</g>
