<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="20" font-weight="400">
<text x="1348" y="629" text-anchor="middle">native_post_send</text>
</g>
<g fill="#3B6BB0" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
