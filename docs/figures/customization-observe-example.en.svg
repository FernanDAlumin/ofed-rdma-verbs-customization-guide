<title id="title">Customize RDMA Verbs: Observe Send Calls</title>
<desc id="desc">Save the effective native callback and install a context-scoped overlay. At runtime, count calls and observed WRs, then delegate unchanged requests to the native provider. Preserve the native return value and bad_wr result.</desc>
<rect width="1600" height="1080" fill="white"/>
<g fill="#24324B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="42" font-weight="400">
<text x="64" y="84" text-anchor="start">Customize RDMA Verbs: Observe Send Calls</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="66" y="123" text-anchor="start">Usage example  /  Add per-context counters, then delegate to the native provider</text>
</g>
<rect x="64" y="158" width="1472" height="174" rx="12" fill="#F7F9FC" stroke="#BCCADC" stroke-width="1"/>
<g fill="#24324B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="23" font-weight="400">
<text x="88" y="202" text-anchor="start">01   SETUP · Once during context creation</text>
</g>
<rect x="92" y="229" width="414" height="78" rx="12" fill="#FFFFFF" stroke="#3B6BB0" stroke-width="2"/>
<g fill="#3B6BB0" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="299" y="264" text-anchor="middle">Complete native initialization</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
<text x="299" y="294" text-anchor="middle">Base ops + hardware variant</text>
</g>
<rect x="591" y="229" width="414" height="78" rx="12" fill="#FFFFFF" stroke="#3B6BB0" stroke-width="2"/>
<g fill="#3B6BB0" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
<text x="798" y="264" text-anchor="middle">Save the effective native callback</text>
</g>
<g fill="#64748B" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="17" font-weight="400">
<text x="798" y="294" text-anchor="middle">native_post_send ← effective callback</text>
</g>
<rect x="1090" y="229" width="418" height="78" rx="12" fill="#EAF7F7" stroke="#167D8D" stroke-width="2"/>
<g fill="#167D8D" font-family="Helvetica, Arial, PingFang SC, sans-serif" font-size="22" font-weight="400">
